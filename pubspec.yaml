name: yatra_canvas
description: A travel-planning Flutter application with a FastAPI backend.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  http: ^1.6.0
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  default-flavor: regular
  uses-material-design: true
  shaders:
    - shaders/yatra_refractive_glass.frag
  assets:
    - lib/Logo/logo.svg
    - lib/assets/home/
    - lib/assets/fonts/OFL.txt
  fonts:
    - family: HomeInter
      fonts:
        - asset: lib/assets/fonts/Inter.ttf
