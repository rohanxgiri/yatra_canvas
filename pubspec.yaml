name: yatra_canvas
description: A travel-planning Flutter application with a FastAPI backend.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  http: ^1.6.0
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.1
  cached_network_image: ^4.0.0
  sqflite: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  default-flavor: regular
  uses-material-design: true
  shaders:
    - shaders/yatra_refractive_glass.frag
  assets:
    - lib/Logo/logo.svg
    - lib/assets/home/
    - lib/assets/onboarding/
    - lib/assets/onboarding/figma_map/
    - assets/images/place_fallbacks/
    - assets/city_packs/jaipur/images/yc_in_rj_jaipur_albert_hall_museum/primary.webp
    - assets/city_packs/jaipur/images/yc_in_rj_jaipur_amber_fort/primary.webp
    - assets/city_packs/jaipur/images/yc_in_rj_jaipur_birla_mandir_aka_the_marble_temple/primary.webp
    - assets/city_packs/jaipur/images/yc_in_rj_jaipur_city_palace/primary.webp
    - assets/city_packs/jaipur/images/yc_in_rj_jaipur_hawa_mahal/primary.webp
    - assets/city_packs/jaipur/images/yc_in_rj_jaipur_jaigarh_fort/primary.webp
    - assets/city_packs/jaipur/images/yc_in_rj_jaipur_jal_mahal/primary.webp
    - assets/city_packs/jaipur/images/yc_in_rj_jaipur_jantar_mantar/primary.webp
    - assets/city_packs/jaipur/images/yc_in_rj_jaipur_nahargarh_fort/primary.webp
    - assets/city_packs/jaipur/images/yc_in_rj_jaipur_patrika_gate/primary.webp
    - lib/assets/fonts/OFL.txt
  fonts:
    - family: HomeInter
      fonts:
        - asset: lib/assets/fonts/Inter.ttf
    - family: InriaSerif
      fonts:
        - asset: lib/assets/fonts/InriaSerif-BoldItalic.ttf
          weight: 700
          style: italic
